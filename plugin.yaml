name: feishu-cardkit
label: Feishu streaming cards (CardKit)
kind: platform
version: 0.2.1
description: >
  Native streaming cards for Hermes Agent's Feishu / Lark channel: typewriter replies in one
  CardKit card, a collapsed tool timeline, typeset formulas, figures with captions and titled
  tables. Replaces the bundled "feishu" platform entry at runtime; patches no Hermes source.
author: wayne3767
license: MIT
homepage: https://github.com/wayne3767/hermes-feishu-cardkit
tags: [feishu, lark, streaming, cardkit]
requires_env:
  - FEISHU_APP_ID
  - FEISHU_APP_SECRET
optional_env:
  - name: FEISHU_STREAMING_CARD
    description: "Stream replies as a CardKit streaming card (needs the cardkit:card:write scope); false = bundled behaviour"
    default: "true"
  - name: FEISHU_CARD_MATH_IMAGES
    description: "Typeset display formulas as images when matplotlib is installed"
    default: "true"
  - name: FEISHU_CRON_CARD
    description: "Send cron job output as a static card; false = ordinary messages"
    default: "true"
  - name: FEISHU_CARD_LOCALE
    description: "Card wording: zh or en (default: Chinese on feishu, English on lark)"
    default: ""
